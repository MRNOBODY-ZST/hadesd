server {
    listen 8080;
    server_name _;
    root /srv/published/current/site;
    index index.html;
    server_tokens off;
    charset utf-8;
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript text/javascript application/json application/xml text/xml text/x-script application/octet-stream;
    client_max_body_size 26m;
    open_file_cache off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Cache-Control "no-cache, must-revalidate" always;
    location ^~ /api/v1/internal { return 403; }
    location /api/ {
        gzip off;
        proxy_pass http://backend:8080;
        # Keep one authoritative value for browser security headers.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
    location = /admin { return 308 /admin/; }
    location /admin/ {
        root /srv;
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    }
    location /assets/ {
        root /srv/published;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    location ~ /\. { deny all; }
    location ~ ^/(?:releases|staging|work|snapshot\.json|manifest\.json|__spa-fallback\.html)(?:/|$) { return 404; }
    location / { try_files $uri $uri/index.html =404; }
    error_page 404 /404/index.html;
    location = /404/index.html { internal; }
}
