server {
    listen 8080;
    server_name _;
    root /srv/published/current/site;
    index index.html;
    server_tokens off;
    charset utf-8;
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript text/javascript application/json application/xml text/xml text/x-script application/octet-stream;
    client_max_body_size 26m;
    open_file_cache off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Cache-Control "no-cache, must-revalidate" always;
    location = /health { access_log off; return 200; }
    location ^~ /api/v1/internal { return 403; }
    location /api/ {
        gzip off;
        proxy_pass http://backend:8080;
        # Keep one authoritative value for browser security headers.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        # Preserve the development port for same-origin media checks and URL generation.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
    location = /admin { return 308 /admin/; }
    location /admin/ {
        root /srv;
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    }
    # Editorial images are article content, not a public image-hosting endpoint.
    location /editorial/ {
        valid_referers none server_names localhost 127.0.0.1;
        set $editorial_hotlink $invalid_referer;
        if ($http_sec_fetch_site ~ "^(cross-site|same-site)$") { set $editorial_hotlink 1; }
        # A reader opening an image in its own tab is still allowed.
        set $editorial_fetch "$http_sec_fetch_mode:$http_sec_fetch_dest";
        if ($editorial_fetch = "navigate:document") { set $editorial_hotlink 0; }
        if ($editorial_hotlink) { return 403; }
        try_files $uri =404;
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header Cache-Control "no-store, no-transform" always;
        add_header CDN-Cache-Control no-store always;
        add_header Cloudflare-CDN-Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }
    location /assets/ {
        root /srv/published;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    location ~ /\. { deny all; }
    location ~ ^/(?:releases|staging|work|snapshot\.json|manifest\.json|__spa-fallback\.html)(?:/|$) { return 404; }
    location / { try_files $uri $uri/index.html =404; }
    error_page 404 /404/index.html;
    location = /404/index.html { internal; }
}
