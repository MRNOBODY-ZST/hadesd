# Optional second public host; install only after provisioning the itshades.dev certificate.
# Load alongside public-edge.conf. Both proxy to the same dual-frontend origin.
# Populate the shared Cloudflare real-IP snippet before enabling.
limit_conn_zone $binary_remote_addr zone=journal_clients:10m;
server {
    listen 80;
    listen [::]:80;
    server_name itshades.dev;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://itshades.dev$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name itshades.dev;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/itshades.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/itshades.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:JOURNAL_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    include /etc/nginx/snippets/hadesd-cloudflare-realip.conf;
    client_max_body_size 26m;
    limit_conn journal_clients 20;
    limit_conn_status 429;
    add_header Strict-Transport-Security "max-age=31536000" always;
    access_log /var/log/nginx/journal.access.log;
    error_log /var/log/nginx/journal.error.log;
    location ^~ /api/v1/internal { return 403; }
    location / {
        proxy_pass http://10.77.0.2:18088;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host itshades.dev;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Ssl "";
        proxy_set_header X-Forwarded-Host itshades.dev;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
