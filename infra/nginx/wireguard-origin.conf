# Only the VPS WireGuard peer may supply the public client's address.
# The host's published port must bind only to its WireGuard address.
map "$realip_remote_addr:$http_x_forwarded_proto" $hadesd_public_proto {
    default http;
    "10.77.0.1:https" https;
}
map $hadesd_public_proto $hadesd_public_port {
    default 80;
    https 443;
}
server {
    listen 8080;
    server_name hadesd.sh;
    absolute_redirect off;
    root /srv/published/current/site;
    index index.html;
    server_tokens off;
    charset utf-8;
    set_real_ip_from 10.77.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript text/javascript application/json application/xml text/xml text/x-script application/octet-stream;
    client_max_body_size 26m;
    open_file_cache off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Cache-Control "no-cache, must-revalidate" always;
    location ^~ /api/v1/internal { return 403; }
    location /api/ {
        gzip off;
        proxy_pass http://backend:8080;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_set_header Host hadesd.sh;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Ssl "";
        proxy_set_header X-Forwarded-Host hadesd.sh;
        proxy_set_header X-Forwarded-Proto $hadesd_public_proto;
        proxy_set_header X-Forwarded-Port $hadesd_public_port;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
    location = /admin { return 308 /admin/; }
    location /admin/ {
        root /srv;
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    }
    location /assets/ {
        root /srv/published;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    location ~ /\. { deny all; }
    location ~ ^/(?:releases|staging|work|snapshot\.json|manifest\.json|__spa-fallback\.html)(?:/|$) { return 404; }
    location / { try_files $uri $uri/index.html =404; }
    error_page 404 /404/index.html;
    location = /404/index.html { internal; }
}
