<svg xmlns="http://www.w3.org/2000/svg" width="760" height="700" viewBox="0 0 760 700" role="img" aria-label="字在哪里，效果就画在哪里"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#6a7788"/></marker></defs><rect width="760" height="700" fill="#f5f6f8"/><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif"><text x="42" y="64" font-size="38" fill="#1d1d1f" text-anchor="start" font-weight="650">字在哪里，效果就画在哪里</text><text x="42" y="107" font-size="27" fill="#4b5663" text-anchor="start" font-weight="500">真实 DOM 是排版和交互的依据。</text><rect x="40" y="145" width="680" height="100" rx="18" fill="#fff" stroke="#d7dce2"/><text x="380" y="187" font-size="30" fill="#202124" text-anchor="middle" font-weight="500">DOM：正文、链接与输入框</text><text x="380" y="223" font-size="26" fill="#202124" text-anchor="middle" font-weight="500">选择文字、点击和中文输入都在这里</text><path d="M236 245V292" fill="none" stroke="#6a7788" stroke-width="3" marker-end="url(#arrow)"/><path d="M550 245V457" fill="none" stroke="#6a7788" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="300" width="390" height="100" rx="18" fill="#e9f1fb" stroke="#d7dce2"/><text x="235" y="342" font-size="30" fill="#202124" text-anchor="middle" font-weight="500">Canvas 纹理</text><text x="235" y="378" font-size="26" fill="#202124" text-anchor="middle" font-weight="500">按可见位置绘制内容</text><path d="M236 400V457" fill="none" stroke="#6a7788" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="465" width="390" height="100" rx="18" fill="#fff" stroke="#d7dce2"/><text x="235" y="507" font-size="30" fill="#202124" text-anchor="middle" font-weight="500">Three.js 图形层</text><text x="235" y="543" font-size="26" fill="#202124" text-anchor="middle" font-weight="500">扫描线、辉光等 CRT 效果</text><rect x="462" y="465" width="258" height="100" rx="18" fill="#fff" stroke="#d7dce2"/><text x="591" y="507" font-size="30" fill="#202124" text-anchor="middle" font-weight="500">原生显示</text><text x="591" y="543" font-size="26" fill="#202124" text-anchor="middle" font-weight="500">关闭效果或回退</text><text x="380" y="620" font-size="27" fill="#202124" text-anchor="middle" font-weight="500">图形层改变观感，不重新定义点击位置。</text><text x="380" y="665" font-size="26" fill="#4b5663" text-anchor="middle" font-weight="500">图片可走原生叠层，避免跨域纹理问题。</text></g></svg>
