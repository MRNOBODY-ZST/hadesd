<svg xmlns="http://www.w3.org/2000/svg" width="760" height="700" viewBox="0 0 760 700" role="img" aria-label="能恢复的备份，要把这些带齐"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#6a7788"/></marker></defs><rect width="760" height="700" fill="#f5f6f8"/><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif"><text x="42" y="64" font-size="38" fill="#1d1d1f" text-anchor="start" font-weight="650">能恢复的备份，要把这些带齐</text><text x="42" y="107" font-size="27" fill="#4b5663" text-anchor="start" font-weight="500">同一实例、同一时间点，避免互相对不上。</text><rect x="40" y="145" width="332" height="110" rx="18" fill="#fff" stroke="#d7dce2"/><text x="206" y="187" font-size="30" fill="#202124" text-anchor="middle" font-weight="500">私有配置</text><text x="206" y="223" font-size="26" fill="#202124" text-anchor="middle" font-weight="500">域名、密钥与存储配置</text><rect x="388" y="145" width="332" height="110" rx="18" fill="#fff" stroke="#d7dce2"/><text x="554" y="187" font-size="30" fill="#202124" text-anchor="middle" font-weight="500">MySQL</text><text x="554" y="223" font-size="26" fill="#202124" text-anchor="middle" font-weight="500">文章、账号与发布记录</text><rect x="40" y="275" width="332" height="110" rx="18" fill="#fff" stroke="#d7dce2"/><text x="206" y="317" font-size="30" fill="#202124" text-anchor="middle" font-weight="500">媒体存储</text><text x="206" y="353" font-size="26" fill="#202124" text-anchor="middle" font-weight="500">本地文件或 S3 对象</text><rect x="388" y="275" width="332" height="110" rx="18" fill="#fff" stroke="#d7dce2"/><text x="554" y="317" font-size="30" fill="#202124" text-anchor="middle" font-weight="500">发布目录</text><text x="554" y="353" font-size="26" fill="#202124" text-anchor="middle" font-weight="500">页面、快照与 current</text><path d="M380 403V447" fill="none" stroke="#6a7788" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="455" width="680" height="100" rx="18" fill="#e9f1fb" stroke="#d7dce2"/><text x="380" y="497" font-size="30" fill="#202124" text-anchor="middle" font-weight="500">在隔离环境恢复</text><text x="380" y="533" font-size="26" fill="#202124" text-anchor="middle" font-weight="500">核对正文、附件和当前版本后再开放流量</text><text x="380" y="607" font-size="27" fill="#202124" text-anchor="middle" font-weight="500">Redis 会话可以重建，让用户重新登录。</text><text x="380" y="653" font-size="28" fill="#285b8e" text-anchor="middle" font-weight="500">正文和图片不能靠重新登录找回来。</text></g></svg>
