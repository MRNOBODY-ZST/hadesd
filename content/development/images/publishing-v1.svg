<svg xmlns="http://www.w3.org/2000/svg" width="760" height="750" viewBox="0 0 760 750" role="img" aria-label="发布的关键，是最后那次切换"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#6a7788"/></marker></defs><rect width="760" height="750" fill="#f5f6f8"/><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif"><text x="42" y="64" font-size="38" fill="#1d1d1f" text-anchor="start" font-weight="650">发布的关键，是最后那次切换</text><text x="42" y="107" font-size="27" fill="#4b5663" text-anchor="start" font-weight="500">设定：旧版 A1 + B3，本次只发布 A2。</text><rect x="40" y="145" width="680" height="94" rx="18" fill="#fff" stroke="#d7dce2"/><text x="380" y="187" font-size="30" fill="#202124" text-anchor="middle" font-weight="500">冻结 A2 + B3</text><text x="380" y="223" font-size="26" fill="#202124" text-anchor="middle" font-weight="500">后台继续保存，也不改变这份输入</text><path d="M380 239V277" fill="none" stroke="#6a7788" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="285" width="680" height="94" rx="18" fill="#e9f1fb" stroke="#d7dce2"/><text x="380" y="327" font-size="30" fill="#202124" text-anchor="middle" font-weight="500">构建终端站，再构建阅读站</text><text x="380" y="363" font-size="26" fill="#202124" text-anchor="middle" font-weight="500">分别生成各自域名的页面与资源</text><path d="M380 379V414" fill="none" stroke="#6a7788" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="422" width="680" height="70" rx="18" fill="#fff" stroke="#d7dce2"/><text x="380" y="467" font-size="30" fill="#202124" text-anchor="middle" font-weight="500">两套产物都通过校验？</text><path d="M235 492V550" fill="none" stroke="#6a7788" stroke-width="3" marker-end="url(#arrow)"/><path d="M555 492V550" fill="none" stroke="#6a7788" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="558" width="355" height="100" rx="18" fill="#e6f2eb" stroke="#d7dce2"/><text x="217.5" y="600" font-size="30" fill="#202124" text-anchor="middle" font-weight="500">通过：切换 current</text><text x="217.5" y="636" font-size="26" fill="#202124" text-anchor="middle" font-weight="500">两个域名一起更新</text><rect x="411" y="558" width="309" height="100" rx="18" fill="#fbeee2" stroke="#d7dce2"/><text x="565.5" y="600" font-size="30" fill="#202124" text-anchor="middle" font-weight="500">失败：保持旧版</text><text x="565.5" y="636" font-size="26" fill="#202124" text-anchor="middle" font-weight="500">修好后重新发布</text><text x="380" y="710" font-size="27" fill="#4b5663" text-anchor="middle" font-weight="500">切换后回报失败？读 manifest 对账。</text></g></svg>
