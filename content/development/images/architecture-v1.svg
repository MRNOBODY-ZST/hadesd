<svg xmlns="http://www.w3.org/2000/svg" width="760" height="700" viewBox="0 0 760 700" role="img" aria-label="一份内容，两个阅读入口"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#6a7788"/></marker></defs><rect width="760" height="700" fill="#f5f6f8"/><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif"><text x="42" y="64" font-size="38" fill="#1d1d1f" text-anchor="start" font-weight="650">一份内容，两个阅读入口</text><text x="42" y="107" font-size="27" fill="#4b5663" text-anchor="start" font-weight="500">保存决定草稿，发布决定读者看到什么。</text><rect x="40" y="145" width="680" height="100" rx="18" fill="#fff" stroke="#d7dce2"/><text x="380" y="187" font-size="30" fill="#202124" text-anchor="middle" font-weight="500">后台编辑 → 后端保存</text><text x="380" y="223" font-size="26" fill="#202124" text-anchor="middle" font-weight="500">修订留在数据库，保存不等于公开</text><path d="M380 245V288" fill="none" stroke="#6a7788" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="296" width="680" height="100" rx="18" fill="#e9f1fb" stroke="#d7dce2"/><text x="380" y="338" font-size="30" fill="#202124" text-anchor="middle" font-weight="500">冻结快照 → 发布器构建</text><text x="380" y="374" font-size="26" fill="#202124" text-anchor="middle" font-weight="500">同一份正文与设置，生成两套静态页面</text><path d="M380 396V423H206V453" fill="none" stroke="#6a7788" stroke-width="3" marker-end="url(#arrow)"/><path d="M380 423H554V453" fill="none" stroke="#6a7788" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="461" width="332" height="100" rx="18" fill="#fff" stroke="#d7dce2"/><text x="206" y="503" font-size="30" fill="#202124" text-anchor="middle" font-weight="500">终端站</text><text x="206" y="539" font-size="26" fill="#202124" text-anchor="middle" font-weight="500">hadesd.sh</text><rect x="388" y="461" width="332" height="100" rx="18" fill="#fff" stroke="#d7dce2"/><text x="554" y="503" font-size="30" fill="#202124" text-anchor="middle" font-weight="500">阅读站</text><text x="554" y="539" font-size="26" fill="#202124" text-anchor="middle" font-weight="500">itshades.dev</text><text x="380" y="613" font-size="29" fill="#285b8e" text-anchor="middle" font-weight="500">两个域名共用一次版本切换</text><text x="380" y="660" font-size="27" fill="#202124" text-anchor="middle" font-weight="500">搜索、账号、评论 → 同一个动态 API</text></g></svg>
